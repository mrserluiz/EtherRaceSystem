name: Compilar EtherRaceSystem
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar plugin
        run: mvn -B --no-transfer-progress clean package
      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: EtherRaceSystem_V0.1
          path: target/EtherRaceSystem-0.1.0.jar
          if-no-files-found: error
